<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KI-Scale OS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Adrian Lewu Business OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
<style>
/* Layout: Nikitas OS-Aufbau (Seitenleiste, ⌘K-Topbar, Karten-Raster) im KI-Scale-Branding: Logo C, Serifen-Überschriften, metallisches Grün auf Grünschwarz. */
:root{
  --bg:#070908; --panel:#0e1310; --panel2:#131a15; --line:#1f2a22; --line2:#2b3a2f;
  --fg:#f3f6f2; --muted:#9aa59c; --dim:#66726a;
  --accent:#7ed957; --accent-ink:#0b1408; --accent-soft:rgba(126,217,87,.12);
  --metal:linear-gradient(120deg,#d6ffb8,#8fe061 40%,#3f8a2e 75%,#a6ea7c);
  --btn:linear-gradient(120deg,#b6f08f,#7ed957 50%,#5fb83f);
  --indigo:#c9b77a; --indigo-soft:rgba(201,183,122,.14);
  --warn:#f1b24a; --warn-soft:rgba(241,178,74,.13);
  --bad:#f0716b; --bad-soft:rgba(240,113,107,.13);
  --blue:#5aa9f5; --blue-soft:rgba(90,169,245,.13);
  --f-ui:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-num:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-logo:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --r:12px; --side:236px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
/* Sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;padding:14px 10px 12px max(10px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:block;padding:4px 6px 16px}
.brand svg{display:block;width:200px;max-width:100%;height:auto}
.navlabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:14px 10px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;color:var(--muted);cursor:pointer;text-align:left;font-size:13.5px}
.nav button:hover{background:var(--panel);color:var(--fg)}
.nav button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;font:11px var(--f-num);color:var(--dim)}
.quest{margin-top:auto;border:1px solid rgba(126,217,87,.3);border-radius:14px;padding:12px;background:linear-gradient(120deg,rgba(126,217,87,.10),rgba(126,217,87,.02))}
.quest .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
.live{font-size:10px;letter-spacing:.1em;color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.quest p{margin:4px 0 8px;font-size:11.5px;color:var(--muted)}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--btn);border-radius:9px}
/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,13,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.burger{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;cursor:pointer}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;color:var(--muted);cursor:pointer;font-size:13px}
.search kbd{margin-left:auto;font:11px var(--f-num);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--dim)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;color:var(--muted);cursor:pointer;font-size:13px}
.tabs button.on{background:var(--panel2);border-color:var(--line);color:var(--fg)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--panel2);color:var(--accent);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:600}
.content{padding-block:22px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.hero{background:linear-gradient(120deg,rgba(126,217,87,.10),rgba(126,217,87,.02));border-color:rgba(126,217,87,.28)}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow.acc{color:var(--accent)}
h1{font-family:var(--f-logo);font-size:38px;line-height:1.05;margin:6px 0 4px;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
h1 .g{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--f-logo);font-size:22px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px;line-height:1.15}
.sub{color:var(--muted);font-size:13px}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;border-radius:999px;padding:3px 9px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.ok{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.ind{background:var(--indigo-soft);border-color:transparent;color:var(--indigo)}
.chip.blue{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--btn);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.sm{padding:4px 9px;font-size:12px}
.goal{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.goal .bar{height:7px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .h{display:flex;justify-content:space-between;align-items:center}
.ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi .v{font:600 34px/1 var(--f-logo);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .f{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up{color:var(--accent)} .down{color:var(--bad)}
.spark{height:30px;display:flex;align-items:flex-end;gap:3px}
.spark i{flex:1;background:var(--line2);border-radius:2px;min-height:2px}
.spark i.last{background:var(--btn)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch .r{font-size:11.5px;color:var(--dim)}
/* Rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tt{font-weight:500}
.row .ds{font-size:12px;color:var(--muted);margin-top:1px}
.row .tg{margin-top:6px}
.check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--dim);background:none;cursor:pointer;flex:none;margin-top:2px;display:grid;place-items:center;padding:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:7px;height:4px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .tt{color:var(--dim);text-decoration:line-through}
.go{color:var(--dim);align-self:center;font-size:16px}
.x{border:0;background:none;color:var(--dim);cursor:pointer;font-size:15px;padding:0 4px;align-self:center}
.x:hover{color:var(--bad)}
/* Journey */
.journey{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:9px;top:22px;bottom:2px;width:1.5px;background:var(--line2)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;background:var(--panel);z-index:1}
.step.ok .dot{background:var(--accent);border-color:var(--accent)}
.step.ok .dot::after{content:"";width:7px;height:4px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.step.now .dot{border-color:var(--indigo);box-shadow:0 0 0 4px var(--indigo-soft)}
.step.now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--indigo)}
.step b{font-weight:500;display:block}
.step small{color:var(--muted);font-size:12px}
.step.now b{color:var(--indigo)}
/* Link tiles */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lk{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 12px;min-width:0;transition:border-color .15s}
.lk:hover{border-color:var(--line2);background:var(--panel2)}
.lk .a{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lk b{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk span{font-size:12px;color:var(--muted)}
.lk .ext{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);flex:none}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 -4px}
/* Tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
/* Forms */
.form{display:flex;gap:8px;flex-wrap:wrap}
.in{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;flex:1}
textarea.in{min-height:84px;resize:vertical;width:100%}
select.in{flex:0 0 auto}
.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
/* Chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font:10px var(--f-ui)}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:18px;color:var(--muted);font-size:13px;text-align:center}
.note{font-size:12px;color:var(--dim)}
.state{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
/* Berater */
.chat{display:grid;grid-template-columns:1fr 300px;gap:16px}
.msgs{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:56vh;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;font-size:13.5px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(126,217,87,.3)}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.prompts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pc{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.pc:hover{border-color:var(--line2)}
.pc .eyebrow{display:block;margin-bottom:4px}
.pc span{font-size:12.5px;color:var(--muted)}
/* Kanban */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.col h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tcard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:8px;display:flex;gap:10px;align-items:flex-start}
/* Palette */
.pal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;padding-top:max(12vh,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.palbox{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 16px;font-size:15px;outline:none}
.palres{max-height:50vh;overflow-y:auto;padding:6px}
.palres a,.palres button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.palres .sel{background:var(--panel2)}
.palres small{color:var(--dim);font-size:11.5px;flex:none}
.scrim{display:none}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font-size:13px;z-index:90}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid2e,.chat{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;width:270px;z-index:70;transform:translateX(-102%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65}
  .burger{display:grid;place-items:center}
  .tabs{display:none}
  .kan,.prompts,.grid3{grid-template-columns:1fr}
  .grid4,.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goal{grid-template-columns:1fr}
  h1{font-size:22px}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- v2 ---------- */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;background:var(--bg);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.fstep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.fstep .v{font:600 30px/1 var(--f-logo);font-variant-numeric:tabular-nums}
.fstep .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fstep .c{font-size:12px;color:var(--muted)}
.fstep .fb{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:auto}
.fstep .fb i{display:block;height:100%;background:var(--btn)}
.rate{font-weight:600}
.rate.ok{color:var(--accent)} .rate.warn{color:var(--warn)} .rate.bad{color:var(--bad)}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.hb .t{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:6px;background:var(--btn)}
.hb .t i.alt{background:linear-gradient(90deg,#c9b77a,#e6d49b)}
.hb .n{text-align:right;font-variant-numeric:tabular-nums}
.lead{display:flex;flex-direction:column;gap:8px}
.lead .p{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center}
.rank{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line2)}
.rank.g1{background:var(--btn);color:var(--accent-ink);border:0}

/* Creatives */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.cr{border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden;cursor:zoom-in;padding:0;text-align:left;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.cr:hover{border-color:rgba(126,217,87,.5);transform:translateY(-2px)}
.cr img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--panel2)}
.cr.story img{aspect-ratio:9/16}
.cr .m{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.cr .m b{font-size:13px;font-weight:600}
.cr .m small{font-size:11.5px;color:var(--muted);display:block}
.thumb{width:44px;height:55px;border-radius:7px;object-fit:cover;display:block;cursor:zoom-in;border:1px solid var(--line2)}
.lb{position:fixed;inset:0;z-index:95;background:rgba(3,5,4,.94);display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.lb-top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-stage{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab}
.lb-stage:active{cursor:grabbing}
.lb-stage img{position:absolute;left:50%;top:50%;max-width:92%;max-height:92%;transform-origin:center center;user-select:none;-webkit-user-drag:none;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}

function kpiCard(o){return '<div class="card kpi"><div class="h"><span class="eyebrow">'+o.l+'</span><span class="ico" style="background:var(--'+o.c+'-soft);color:var(--'+o.c+')">'+svg(o.i)+'</span></div><div class="v">'+o.v+'</div><div class="f">'+o.f+'</div>'+(o.s?spark(o.s):'')+'</div>'}
function spark(arr){const mx=Math.max(1,...arr);return '<div class="spark" aria-hidden="true">'+arr.map((v,i)=>'<i class="'+(i===arr.length-1?'last':'')+'" style="height:'+Math.max(6,v/mx*100)+'%"></i>').join('')+'</div>'}
function linkTiles(list){return '<div class="links">'+list.filter(Boolean).map(l=>'<a class="lk" href="'+esc(l.u)+'" target="_blank" rel="noopener"><div class="a"><b>'+esc(l.t)+'</b><span class="ext">'+(l.k==='tool'?'Tool':'Seite')+' ↗</span></div><span>'+esc(l.d)+'</span></a>').join('')+'</div>'}
function taskRow(t){return '<div class="row '+(t.done?'done':'')+'"><button class="check '+(t.done?'on':'')+'" data-tog="'+t.id+'" aria-label="Erledigt umschalten"></button><div class="tx"><div class="tt">'+esc(t.title)+'</div>'+(t.note?'<div class="ds">'+esc(t.note)+'</div>':'')+'<div class="tg chips"><span class="chip '+(t.owner==='Claude'?'ind':'ok')+'">'+esc(t.owner||'Adrian')+'</span>'+(t.area?'<span class="chip">'+esc(t.area)+'</span>':'')+(t.prio===1?'<span class="chip bad">Wichtig</span>':'')+'</div></div><button class="x" data-del="'+t.id+'" aria-label="Löschen">×</button></div>'}
function dbNote(){return S.dbOk?'':'<div class="note">Speicher nicht verbunden – Änderungen gelten nur bis zum Neuladen.</div>'}
function closeState(){const c=S.close;if(c.err)return '<span class="chip warn">Close: '+esc(c.err)+'</span>';if(c.at)return '<span class="state"><span class="live">LIVE</span> Close · '+new Date(c.at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</span>';return '<span class="state">Close lädt …</span>'}
function seg(name,cur,opts){return '<div class="seg" role="group">'+opts.map(o=>'<button data-seg="'+name+'|'+o[0]+'" class="'+(cur===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</div>'}
function barChart(data,h=150,color){
  if(!data||!data.length)return '<div class="empty">Noch keine Daten.</div>';
  const W=600,H=h,pl=34,pb=22,pt=10,mx=Math.max(1,...data.map(d=>d.v));
  const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step)*step||1;
  const bw=(W-pl-8)/data.length;let g='';
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#1f2a22"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+nf(Math.round(top*i/4))+'</text>'}
  data.forEach((d,i)=>{const hh=(H-pt-pb)*(d.v/top),x=pl+i*bw+bw*.18,y=H-pb-hh;g+='<rect x="'+x+'" y="'+y+'" width="'+(bw*.64)+'" height="'+Math.max(0,hh)+'" rx="3" fill="'+(i===data.length-1?(color||'#7ed957'):'#2b3a2f')+'"><title>'+esc(d.l)+': '+nf(d.v)+'</title></rect>';if(data.length<=14)g+='<text x="'+(x+bw*.32)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(d.l)+'</text>'});
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Balkendiagramm">'+g+'</svg></div>';
}
function hbars(rows,alt){const mx=Math.max(1,...rows.map(r=>r.v));return '<div class="hbars">'+rows.map(r=>'<div class="hb"><span>'+esc(r.l)+'</span><span class="t"><i class="'+(alt?'alt':'')+'" style="width:'+Math.max(1,r.v/mx*100)+'%"></i></span><span class="n num">'+(r.f?r.f(r.v):nf(r.v))+'</span></div>').join('')+'</div>'}

function lpTest(){
  const L=S.lp||{};const V=L.varianten||{};const names={a:'Seite A · Produktseite',b:'Seite B · Clean',c:'Seite C · Video'};
  const rows=['a','b','c'].map(k=>{const v=V[k]||{};const bes=Number(v.besucher||0),kl=Number(v.klicks||0),vk=Number(v.verkaeufe||0);return{k,n:names[k],bes,kl,vk,kq:pct(kl,bes),cr:pct(vk,bes),url:'https://faceless.adrian-lewu.de/'+k+'/?nosplit'}});
  const total=rows.reduce((s,r)=>s+r.bes,0);

function kategorisiere(text,betrag){for(const r of RULES){if(r[0].test(text))return{konto:r[1],kategorie:r[2]}}return betrag>0?{konto:'geschaeft',kategorie:'Umsatz'}:{konto:'privat',kategorie:'Sonstiges privat'}}
function parseCSV(txt){const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
function toNum(s){s=String(s||'').trim().replace(/[€$\s]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s)}
function toDate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return null}
function importRows(txt,konto){const r=parseCSV(txt);if(r.length<2)return[];const h=r[0].map(x=>x.toLowerCase().trim());const fi=re=>h.findIndex(x=>re.test(x));
  const iD=fi(/^(date|datum|buchungstag|booking date|created on|valuta)/),iA=fi(/^(amount|betrag|umsatz|source amount|wert)/),iT=[fi(/description|beschreibung|verwendungszweck|details/),fi(/payee|merchant|empfänger|auftraggeber|counterparty|name/)].filter(i=>i>=0),iDir=fi(/^direction$/);
  if(iD<0||iA<0)return null;
  return r.slice(1).map(c=>{let b=toNum(c[iA]);if(iDir>=0&&/out/i.test(c[iDir]))b=-Math.abs(b);const text=iT.map(i=>c[i]).filter(Boolean).join(' · ').trim()||'Buchung';const d=toDate(c[iD]);if(!d||isNaN(b)||b===0)return null;const k=kategorisiere(text,b);return{datum:d,text,betrag:Math.abs(b),typ:b>0?'ein':'aus',konto:konto==='auto'?k.konto:konto,kategorie:konto==='auto'||konto===k.konto?k.kategorie:(konto==='privat'?(b>0?'Gehalt / Entnahme':'Sonstiges privat'):(b>0?'Umsatz':'Sonstiges Geschäft')),quelle:'csv'}}).filter(Boolean)}
function hashId(b){let h=0;const s=b.datum+'|'+b.betrag+'|'+b.text;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'c'+(h>>>0).toString(36)}

/* Second Brain */
function md(src){
  const lines=String(src||'').split('\n');let out='',i=0;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
  while(i<lines.length){let l=lines[i];
    if(/^```/.test(l)){let b='';i++;while(i<lines.length&&!/^```/.test(lines[i])){b+=esc(lines[i])+'\n';i++}i++;out+='<pre>'+b+'</pre>';continue}
    if(/^#{1,4}\s/.test(l)){out+='<h3>'+inline(l.replace(/^#+\s/,''))+'</h3>';i++;continue}
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++}const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const head=cells(rows[0]);const body=rows.slice(rows[1]&&/^\|[\s:|-]+\|$/.test(rows[1])?2:1);out+='<div class="tbl"><table><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+cells(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
    if(/^\s*[-*]\s/.test(l)){out+='<ul>';while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){out+='<li>'+inline(lines[i].replace(/^\s*[-*]\s/,''))+'</li>';i++}out+='</ul>';continue}
    if(/^\s*\d+\.\s/.test(l)){out+='<ol>';while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){out+='<li>'+inline(lines[i].replace(/^\s*\d+\.\s/,''))+'</li>';i++}out+='</ol>';continue}
    if(l.trim()){out+='<p>'+inline(l)+'</p>'}i++}
  return out}

/* ---------- Lightbox ---------- */
const LB={items:[],i:0,s:1,x:0,y:0,pts:new Map(),d0:0,s0:1};
function lbOpen(items,i){LB.items=items;LB.i=i;$('#lb').hidden=false;lbShow()}
function lbShow(){const it=LB.items[LB.i];LB.s=1;LB.x=0;LB.y=0;$('#lbImg').src=it.src;$('#lbImg').alt=it.t;$('#lbT').textContent=it.t+(LB.items.length>1?'  ·  '+(LB.i+1)+' / '+LB.items.length:'');lbApply()}
function lbApply(){$('#lbImg').style.transform='translate(calc(-50% + '+LB.x+'px), calc(-50% + '+LB.y+'px)) scale('+LB.s+')';$('#lbZ').textContent=Math.round(LB.s*100)+' %'}
function lbZoom(f){LB.s=Math.min(8,Math.max(.5,LB.s*f));lbApply()}
function lbClose(){$('#lb').hidden=true}
(function(){const st=$('#lbStage');
 st.addEventListener('wheel',e=>{e.preventDefault();lbZoom(e.deltaY<0?1.12:1/1.12)},{passive:false});
 st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(LB.pts.size===2){const p=[...LB.pts.values()];LB.d0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);LB.s0=LB.s}});
 st.addEventListener('pointermove',e=>{const prev=LB.pts.get(e.pointerId);if(!prev)return;LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(LB.pts.size===2){const p=[...LB.pts.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(LB.d0){LB.s=Math.min(8,Math.max(.5,LB.s0*d/LB.d0));lbApply()}}else{LB.x+=e.clientX-prev.x;LB.y+=e.clientY-prev.y;lbApply()}});
 const up=e=>{LB.pts.delete(e.pointerId);if(LB.pts.size<2)LB.d0=0};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 st.addEventListener('dblclick',()=>{LB.s=LB.s>1?1:2.5;LB.x=0;LB.y=0;lbApply()});
 $('#lbIn').onclick=()=>lbZoom(1.25);$('#lbOut').onclick=()=>lbZoom(.8);$('#lbReset').onclick=()=>{LB.s=1;LB.x=0;LB.y=0;lbApply()};$('#lbClose').onclick=lbClose;
 $('#lbPrev').onclick=()=>{LB.i=(LB.i-1+LB.items.length)%LB.items.length;lbShow()};$('#lbNext').onclick=()=>{LB.i=(LB.i+1)%LB.items.length;lbShow()};
})();

  on('kForm','submit',e=>{e.preventDefault();const n=$('#kName').value.trim();if(n)addDoc('kunden',{name:n,produkt:$('#kProd').value,aktiv:$('#kAktiv').value||new Date().toISOString().slice(0,10)})});
  on('oForm','submit',e=>{e.preventDefault();const n=$('#oName').value.trim();if(n)addDoc('outreach',{name:n,kanal:$('#oKanal').value,status:'geplant',gesendet:0,geoeffnet:0,geklickt:0,antworten:0,termine:0,verkaeufe:0,umsatz:0})});
  on('oEditForm','submit',e=>{e.preventDefault();const x=S.outreach.find(o=>o.id===S.oEdit);if(!x)return;const d={...strip(x)};['gesendet','geoeffnet','geklickt','antworten','termine','verkaeufe','umsatz'].forEach(k=>d[k]=Number($('#oe_'+k).value)||0);d.status=d.gesendet>0?'läuft':x.status;d.stand=new Date().toISOString();S.oEdit=null;saveDoc('outreach',x.id,d);toast('Zahlen gespeichert')});
  on('rForm','submit',e=>{e.preventDefault();saveDoc('reviews',weekId(),{gut:$('#rGut').value,schlecht:$('#rSchlecht').value,fokus:$('#rFokus').value,am:new Date().toISOString()});toast('Review gespeichert')});
  on('wForm','submit',e=>{e.preventDefault();const t=$('#wTitel').value.trim(),x=$('#wText').value.trim();if(!t||!x)return toast('Titel und Text eintragen');const id='n'+Date.now().toString(36);S.wSel=id;saveDoc('wissen',id,{titel:t,bereich:$('#wBereich').value,quelle:'Adrian',text:x,ord:900,created:new Date().toISOString()});toast('Im Second Brain gespeichert')});
  on('wQ','input',e=>{S.wQ=e.target.value;const p=e.target.selectionStart;render();const n=$('#wQ');if(n){n.focus();n.setSelectionRange(p,p)}});
  on('askForm','submit',e=>{e.preventDefault();const q=$('#askIn').value.trim();if(q)ask(q)});
  on('streakBtn','click',()=>{const t=new Date().toISOString().slice(0,10);const s=S.streak||{tage:0};if(s.letzter===t)return toast('Heute schon gezählt');const y=new Date(Date.now()-864e5).toISOString().slice(0,10);saveDoc('app','streak',{tage:s.letzter===y?(s.tage||0)+1:1,letzter:t});toast('Streak gezählt')});
  on('libQ','input',e=>{$('#lib').innerHTML=libHtml(e.target.value)});
  on('finMonat','change',e=>{S.finMonat=e.target.value;render()});
  on('csvIn','change',e=>{const f=e.target.files&&e.target.files[0];if(f)readCsv(f)});
  const dr=$('#drop');if(dr){dr.addEventListener('dragover',e=>{e.preventDefault();dr.classList.add('over')});dr.addEventListener('dragleave',()=>dr.classList.remove('over'));dr.addEventListener('drop',e=>{e.preventDefault();dr.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readCsv(f)})}
  on('impCancel','click',()=>{S.imp=null;render()});
  on('impGo','click',async()=>{const rows=S.imp.rows;S.imp=null;toast('Importiere '+rows.length+' Buchungen …');let n=0;for(const b of rows){const id=hashId(b);if(S.buchungen.some(x=>x.id===id))continue;await saveDoc('buchungen',id,{...b,created:new Date().toISOString()});n++}toast(n+' Buchungen importiert');render()});
  document.querySelectorAll('[data-kat]').forEach(s=>s.addEventListener('change',()=>{const b=S.buchungen.find(x=>x.id===s.dataset.kat);if(!b)return;const kat=s.value;const konto=KAT.privat.includes(kat)?'privat':'geschaeft';saveDoc('buchungen',b.id,{...strip(b),kategorie:kat,konto});toast('Kategorie geändert')}));
  const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
}
function readCsv(f){const r=new FileReader();r.onload=()=>{const rows=importRows(String(r.result),$('#impKonto')?$('#impKonto').value:'auto');if(rows===null)return toast('Spalten für Datum und Betrag nicht gefunden. Bitte CSV-Export wählen.');if(!rows.length)return toast('Keine Buchungen in der Datei gefunden.');S.imp={rows};if(rows[0])S.finMonat=monthKey(rows[0].datum);render()};r.readAsText(f)}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
  const sg=e.target.closest('[data-seg]');if(sg){const[k,v]=sg.dataset.seg.split('|');S[k]=v;render();return}
  const lb=e.target.closest('[data-lb]');if(lb){const[tab,i]=lb.dataset.lb.split('|');if(tab==='ads'){const items=ADS.map(a=>({t:'Anzeige '+a[0],src:'img/ads/'+a[2]+'.jpg'}));lbOpen(items,ADS.findIndex(a=>a[0]===i))}else{const o=S.crTab;S.crTab=tab;const items=crItems();S.crTab=o;lbOpen(items,Number(i))}return}
  const tg=e.target.closest('[data-tog]');if(tg){const t=S.tasks.find(x=>x.id===tg.dataset.tog);if(t)saveDoc('tasks',t.id,{...strip(t),done:!t.done,doneAt:!t.done?new Date().toISOString():null});return}
  const d=e.target.closest('[data-del]');if(d){delDoc('tasks',d.dataset.del);return}
  const db_=e.target.closest('[data-delb]');if(db_){delDoc('buchungen',db_.dataset.delb);return}
  const dp=e.target.closest('[data-delp]');if(dp){delDoc('partner',dp.dataset.delp);return}
  const dk=e.target.closest('[data-delk]');if(dk){delDoc('kunden',dk.dataset.delk);return}
  const dw=e.target.closest('[data-delw]');if(dw){S.wSel=null;delDoc('wissen',dw.dataset.delw);return}
  const ws=e.target.closest('[data-wsel]');if(ws){S.wSel=ws.dataset.wsel;render();return}
  const oe=e.target.closest('[data-oedit]');if(oe){S.oEdit=oe.dataset.oedit||null;render();return}
  const inc=e.target.closest('[data-inc]');if(inc){const[id,f]=inc.dataset.inc.split('|');const p=S.partner.find(x=>x.id===id);if(p)saveDoc('partner',id,{...strip(p),[f]:(Number(p[f])||0)+1});return}
  const a=e.target.closest('[data-ask]');if(a){ask(a.dataset.ask);return}
});
document.getElementById('logout').addEventListener('click',async e=>{e.preventDefault();try{await fetch('/api/logout',{credentials:'same-origin'})}catch(_){}location.href='/login'});
$('#burger').addEventListener('click',()=>{$('#side').classList.add('open');$('#scrim').classList.add('open')});
$('#scrim').addEventListener('click',()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('open')});

/* ---------- Daten speichern (db, sonst lokal) ---------- */
const strip=o=>{const c={...o};delete c.id;return c};
function localSet(coll,id,data){if(coll==='app'&&id==='streak'){S.streak=data}else if(coll==='reviews'){S.reviews[id]=data}else{const arr=S[coll];const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]={id,...data};else arr.unshift({id,...data})}refresh()}
async function saveDoc(coll,id,data){if(db){try{await db.collection(coll).doc(id).set(data);return}catch(e){toast('Speichern fehlgeschlagen: '+(e.message||e.code))}}localSet(coll,id,data)}
async function addDoc(coll,data){data.created=new Date().toISOString();const id=coll.slice(0,1)+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await saveDoc(coll,id,data);toast('Gespeichert')}
async function delDoc(coll,id){if(db){try{await db.collection(coll).doc(id).delete();return}catch(e){toast('Löschen fehlgeschlagen')}}S[coll]=S[coll].filter(x=>x.id!==id);refresh()}
function addTask(t){addDoc('tasks',{done:false,...t})}
let rT=null;function refresh(){clearTimeout(rT);rT=setTimeout(()=>{renderNav();const a=document.activeElement;const typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&(a.value||a.tagName==='SELECT');if(!typing)render()},60)}

/* ---------- Berater (Claude) ---------- */
async function ask(q){
  S.chat.push({role:'user',content:q});S.chat.push({role:'assistant',content:'…'});render();
  if(!sample){S.chat[S.chat.length-1].content='Der Berater ist noch nicht eingerichtet.';render();return}
  const m=S.meta||{};const wk=salesAgg(periodWeeksFor('woche'));const w4=salesAgg(periodWeeksFor('4w'));
  const fin=['geschaeft','privat'].map(k=>{const l=buch(k);const kat={};l.filter(b=>b.typ==='aus').forEach(b=>kat[b.kategorie]=(kat[b.kategorie]||0)+Number(b.betrag));return k+': Einnahmen '+eur(l.filter(b=>b.typ==='ein').reduce((s,b)=>s+Number(b.betrag),0))+', Ausgaben nach Kategorie '+Object.entries(kat).map(([a,v])=>a+' '+eur(v)).join(', ')}).join(' | ');
  const ctx='Du bist der persönliche Business-Berater von Adrian Lewu (KI-Scale LLC, DACH). Antworte auf Deutsch, direkt, konkret, kurz, mit nummerierten Schritten wo sinnvoll. Keine Floskeln, keine erfundenen Zahlen.\n'+
   'Stand '+new Date().toLocaleString('de-DE')+':\n'+
   '- Faceless Pages mit KI, 197 €, ablefy, Launch-Tag '+dayN()+'. Ziel 15.000 € Umsatz/Monat, ROAS ≥ 4.\n'+
   '- Umsatz Monat '+eur(umsatz())+' · Verkäufe '+(verkaeufe()??'unbekannt')+'\n'+
   '- Meta: '+(m.status||'in Prüfung')+', Ausgaben '+eur(m.ausgaben)+', Impressionen '+nf(m.impressionen)+', Klicks '+nf(m.klicks)+', Checkouts '+nf(m.checkouts)+', Käufe '+nf(m.kaeufe)+', ROAS '+(roas()?.toFixed(2)??'–')+'.'+(m.ads&&m.ads.length?' Anzeigen: '+m.ads.map(a=>a.name+' '+(a.status||'')+' '+eur(a.ausgaben)+' CTR '+(a.ctr??'–')).join('; '):'')+'\n'+
   '- Vertrieb diese Woche (Close): Anwahlen '+wk.anw+', erreicht '+wk.err+', Termine '+wk.termine+', Setting erschienen '+wk.qual+', Setting No-Show '+wk.sns+', Show-Quote '+pf(wk.showS)+', Closing-Termine '+wk.closingT+', Zusagen '+wk.zusage+'. Letzte 4 Wochen: Anwahlen '+w4.anw+', Termine '+w4.termine+', Show-Quote '+pf(w4.showS)+'. Ziele: 8 Termine/Tag, Show 50→65 %, Abschluss 15 %.\n'+
   '- Pipeline: '+Object.entries(S.close.status).map(([k,v])=>k+' '+v).join(', ')+'\n'+
   '- Finanzen diesen Monat: '+fin+'\n'+
   '- Outreach: '+S.outreach.map(o=>o.name+' ('+o.kanal+') gesendet '+nf(o.gesendet)+', Antworten '+nf(o.antworten)+', Termine '+nf(o.termine)).join('; ')+'\n'+
   '- Angebote: Premium 15.000 €, Starter 4.000 €, Finanzierung; Closer 15 %, Opener 2.000 €/Abschluss.\n'+
   '- Offene Aufgaben: '+open().slice(0,12).map(t=>t.title+' ['+t.owner+']').join('; ');
  const hist=S.chat.slice(0,-1).slice(-10);
  const msgs=[{role:'user',content:ctx+'\n\nFrage: '+hist[0].content},...hist.slice(1)];
  try{
    const r=await sample(msgs,{cache:false,onText:({text})=>{S.chat[S.chat.length-1].content=text;const el=document.querySelector('#msgs .msg:last-child');if(el){el.textContent=text;el.parentNode.scrollTop=1e6}}});
    S.chat[S.chat.length-1].content=r.text;
  }catch(e){S.chat[S.chat.length-1].content=e&&e.code==='not_granted'?'Der Berater ist für diese Ansicht nicht freigegeben.':e&&e.code==='rate_limited'?'Kurz zu viele Fragen. Versuch es gleich noch einmal.':(e&&e.code)||'Keine Antwort erhalten.'}
  render();
}

/* ---------- ⌘K Palette ---------- */
let palSel=0,palItems=[];
function palOpen(){$('#pal').hidden=false;$('#palIn').value='';palRender('');setTimeout(()=>$('#palIn').focus(),10)}
function palClose(){$('#pal').hidden=true}
function palRender(q){q=q.toLowerCase();
  const views=NAV.filter(n=>n.id).map(n=>({t:n.t,k:'Bereich',go:n.id}));
  const tasks=open().map(t=>({t:t.title,k:'Aufgabe',go:'aufgaben'}));
  const wiss=S.wissen.map(w=>({t:w.titel,k:'Second Brain',go:'wissen',w:w.id}));
  palItems=[...views,...wiss,...LINKS.map(l=>({t:l.t,k:GROUPS[l.g]||'',u:l.u})),...tasks].filter(x=>(x.t+' '+x.k).toLowerCase().includes(q)).slice(0,40);
  palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $('#palRes').innerHTML=palItems.map((x,i)=>x.u?'<a href="'+esc(x.u)+'" target="_blank" rel="noopener" class="'+(i===palSel?'sel':'')+'">'+esc(x.t)+'<small>'+esc(x.k)+' ↗</small></a>':'<button data-pgo="'+x.go+'|'+(x.w||'')+'" class="'+(i===palSel?'sel':'')+'">'+esc(x.t)+'<small>'+esc(x.k)+'</small></button>').join('')||'<div class="note" style="padding:10px">Nichts gefunden.</div>';
}
function palGo(v){const[g,w]=v.split('|');if(w)S.wSel=w;go(g)}
$('#openPal').addEventListener('click',palOpen);
$('#pal').addEventListener('click',e=>{if(e.target.id==='pal')palClose();const b=e.target.closest('[data-pgo]');if(b){palClose();palGo(b.dataset.pgo)}const a=e.target.closest('a');if(a)palClose()});
$('#palIn').addEventListener('input',e=>{palSel=0;palRender(e.target.value)});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').hidden?palOpen():palClose();return}
  if(!$('#lb').hidden){if(e.key==='Escape')lbClose();if(e.key==='ArrowRight')$('#lbNext').click();if(e.key==='ArrowLeft')$('#lbPrev').click();if(e.key==='+')lbZoom(1.25);if(e.key==='-')lbZoom(.8);return}
  if($('#pal').hidden)return;
  if(e.key==='Escape')palClose();
  if(e.key==='ArrowDown'){palSel=Math.min(palItems.length-1,palSel+1);palRender($('#palIn').value);e.preventDefault()}
  if(e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);palRender($('#palIn').value);e.preventDefault()}
  if(e.key==='Enter'){const x=palItems[palSel];if(!x)return;palClose();if(x.u){const a=document.createElement('a');a.href=x.u;a.target='_blank';a.rel='noopener';a.click()}else palGo(x.go+'|'+(x.w||''))}
});

/* ---------- Start ---------- */
const h=(location.hash||'').slice(1);if(VIEWS[h])S.view=h;
renderNav();render();

/* ---------- Server-Anbindung (eigener Server statt Claude) ---------- */
const API={async get(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){location.href='/login';throw new Error('nicht angemeldet')}if(!r.ok)throw new Error('Server '+r.status);return r.json()},
 async send(m,u,b){const r=await fetch(u,{method:m,credentials:'same-origin',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status===401){location.href='/login';throw new Error('nicht angemeldet')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Server '+r.status));return j}};
const CACHE={},SUBS=[];let SINCE=0;
function applyChange(c){const m=(CACHE[c.coll]=CACHE[c.coll]||{});if(c.data)m[c.id]=c.data;else delete m[c.id]}
function fireColl(coll){SUBS.forEach(s=>{if(s.coll===coll)s.fire()})}
async function poll(){try{const j=await API.get('/api/changes?since='+SINCE);const t=new Set();j.changes.forEach(c=>{applyChange(c);t.add(c.coll);if(c.updated>SINCE)SINCE=c.updated});t.forEach(fireColl);S.online=true}catch(e){S.online=false}}
db={collection(coll){return{onSnapshot(fn){const s={coll,fire:()=>{const m=CACHE[coll]||{};const docs=Object.entries(m).map(([id,d])=>({id,data:()=>d}));fn({docs,size:docs.length,empty:!docs.length})}};SUBS.push(s);s.fire();return()=>{}},
  doc(id){return{async set(d){await API.send('PUT','/api/coll/'+encodeURIComponent(coll)+'/'+encodeURIComponent(id),d);applyChange({coll,id,data:d});fireColl(coll)},async delete(){await API.send('DELETE','/api/coll/'+encodeURIComponent(coll)+'/'+encodeURIComponent(id));applyChange({coll,id,data:null});fireColl(coll)}}}}},
 doc(p){const[coll,id]=p.split('/');return{onSnapshot(fn){const s={coll,fire:()=>{const d=(CACHE[coll]||{})[id];fn({exists:!!d,data:()=>d})}};SUBS.push(s);s.fire();return()=>{}}}}};
sample=async(msgs)=>{try{const j=await API.send('POST','/api/berater',{messages:msgs});return{text:j.text}}catch(e){throw{code:e.message}}};
(async()=>{
  await poll();
  S.dbOk=true;
  const sub=(c,fn)=>db.collection(c).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));refresh()});
  sub('tasks',a=>{S.tasks=a.sort((x,y)=>String(y.created||'').localeCompare(String(x.created||'')))});
  sub('buchungen',a=>S.buchungen=a);
  sub('partner',a=>S.partner=a);
  sub('kunden',a=>S.kunden=a);
  sub('outreach',a=>S.outreach=a.sort((x,y)=>String(x.created||'').localeCompare(String(y.created||''))));
  sub('wissen',a=>S.wissen=a);
  sub('links',a=>{LINKS=a.sort((x,y)=>(x.ord??0)-(y.ord??0))});
  sub('reviews',a=>{S.reviews={};a.forEach(r=>S.reviews[r.id]=r)});
  db.doc('kpi/meta').onSnapshot(s=>{S.meta=s.exists?s.data():null;refresh()});
  db.doc('kpi/ablefy').onSnapshot(s=>{S.ablefy=s.exists?s.data():null;refresh()});
  db.doc('kpi/lp').onSnapshot(s=>{S.lp=s.exists?s.data():null;refresh()});
  db.doc('kpi/calendly').onSnapshot(s=>{S.cal=s.exists?s.data():null;refresh()});
  db.doc('kpi/close').onSnapshot(s=>{const d=s.exists?s.data():null;if(d){Object.assign(S.close,{weeks:d.weeks||{},status:d.status||{},leads:d.leads,active:d.active,won:d.won,at:d.at,err:null})}else{S.close.err='Schlüssel fehlt'}refresh()});
  db.doc('app/streak').onSnapshot(s=>{S.streak=s.exists?s.data():null;refresh()});
  refresh();
  setInterval(poll,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
})();
